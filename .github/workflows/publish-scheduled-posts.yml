name: Publish scheduled blog posts

# Rebuilds the site every morning so any post whose date has arrived goes live.
# Also runnable by hand from the Actions tab using the "Run workflow" button.

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Tell Vercel to rebuild the site
        run: |
          if [ -z "${{ secrets.VERCEL_DEPLOY_HOOK }}" ]; then
            echo "No deploy hook found. Add a repository secret named VERCEL_DEPLOY_HOOK."
            exit 1
          fi
          curl -sS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
          echo ""
          echo "Rebuild requested."
